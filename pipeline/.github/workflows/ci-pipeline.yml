# NovaPay CI pipeline — stages 1-7. All third-party actions are pinned to full commit SHAs (version in trailing comment); Dependabot/Renovate raises update PRs.
name: NovaPay CI Pipeline
on:
  push: { branches: [main, "release/*", "hotfix/*"] }
  pull_request: { branches: [main] }
permissions:
  contents: read
  id-token: write        # keyless Cosign / cloud OIDC
  security-events: write
  packages: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: registry.novapay.internal/novapay/payments-api
  JAVA_VERSION: "21"
jobs:
  source-verify:                       # Stage 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Verify signed commits
        run: ./pipeline/scripts/verify-signed-commits.sh "${{ github.event.before || 'origin/main' }}" HEAD
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  build:                               # Stage 2
    needs: source-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compute SemVer+metadata
        id: ver
        run: |
          base=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "version=${base}+${GITHUB_SHA::7}.$(date -u +%Y%m%dT%H%MZ).run${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Build & unit test
        run: ./gradlew build test jacocoTestReport --dependency-verification strict
      - name: Coverage gate (80% line / 70% branch)
        run: ./pipeline/scripts/check-coverage.sh --min-line 80 --min-branch 70
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: build-output, path: build/libs/ }

  sast:                                # Stage 3 (parallel)
    needs: build
    uses: ./.github/workflows/reusable-sast.yml
    with: { sonar_project_key: novapay-payments-api, min_coverage: 80 }
    secrets: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }

  dependency-container-scan:           # Stage 4 + 4b (parallel with sast, integration)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: build-output, path: build/libs/ }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: registry.novapay.internal, username: "${{ secrets.REG_USER }}", password: "${{ secrets.REG_TOKEN }}" }
      - name: Build image (local) for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: ., load: true, tags: "${{ env.IMAGE }}:sha-${{ github.sha }}", cache-from: "type=registry,ref=${{ env.IMAGE }}:cache", cache-to: "type=registry,ref=${{ env.IMAGE }}:cache,mode=max" }
      - name: Trivy filesystem + image scan (block Critical; High CVSS>=8 with fix)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with: { image: "${{ env.IMAGE }}:sha-${{ github.sha }}", format: cyclonedx-json, output-file: sbom.cdx.json }
      - name: Licence gate (no GPL/AGPL/SSPL)
        run: ./pipeline/scripts/licence-check.sh sbom.cdx.json
      - name: Push image
        id: push
        run: |
          docker tag ${{ env.IMAGE }}:sha-${{ github.sha }} ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          docker push --all-tags ${{ env.IMAGE }}
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:sha-${{ github.sha }} | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Sign + attach SBOM attestation (Stage 4b)
        run: |
          cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  integration:                         # Stage 5 (parallel)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres: { image: "postgres:16", env: { POSTGRES_PASSWORD: ci }, ports: ["5432:5432"], options: "--health-cmd pg_isready --health-interval 5s --health-retries 10" }
      redis: { image: "redis:7", ports: ["6379:6379"] }
      rabbitmq: { image: "rabbitmq:3.13", ports: ["5672:5672"] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Integration tests + Pact provider verification
        run: ./gradlew integrationTest pactVerify
      - name: Migration compatibility (N-1 and N vs next schema)
        run: ./pipeline/scripts/migration-compat-test.sh
      - name: Pact can-i-deploy
        run: pact-broker can-i-deploy --pacticipant payments-api --version "${GITHUB_SHA}" --to-environment staging
        env: { PACT_BROKER_BASE_URL: "${{ secrets.PACT_URL }}", PACT_BROKER_TOKEN: "${{ secrets.PACT_TOKEN }}" }

  deploy-staging:                      # gates before DAST
    needs: [sast, dependency-container-scan, integration]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/')
    uses: ./.github/workflows/cd-pipeline.yml
    with: { environment: staging, image_digest: "${{ needs.dependency-container-scan.outputs.digest }}" }
    secrets: inherit

  dast-perf:                           # Stage 6 (ZAP and k6 in parallel) against staging
    needs: [deploy-staging, dependency-container-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix: { check: [zap, k6] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: OWASP ZAP API scan
        if: matrix.check == 'zap'
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with: { target: "https://staging.novapay.example/openapi.yaml", format: openapi, rules_file_name: .zap/rules.tsv, fail_action: true }
      - name: k6 load @2x (p99<500ms, err<0.1%)
        if: matrix.check == 'k6'
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
        with: { filename: tests/perf/load-2x.js }

  attest-staging-verified:             # Stage 6c: proof that THIS digest passed staging (blocks hotfix bypass at admission)
    needs: [dast-perf, dependency-container-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Attest staging-verified (Cosign, keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ needs.dependency-container-scan.outputs.digest }}
        run: |
          printf '{"stage":"staging","dast":"pass","perf":"pass","run":"%s","sha":"%s"}' "$GITHUB_RUN_ID" "$GITHUB_SHA" > staging-verified.json
          cosign attest --yes --type https://novapay.example/attestations/staging-verified/v1 --predicate staging-verified.json "$REF"

  policy-gates:                        # Stage 7
    needs: attest-staging-verified
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render Helm and test OPA policies
        run: |
          helm template novapay pipeline/helm/novapay -f pipeline/helm/novapay/values-production.yaml > rendered.yaml
          conftest test rendered.yaml --policy pipeline/policies --all-namespaces
      - name: Checkov (IaC)
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with: { directory: pipeline/terraform, framework: terraform, soft_fail: false }
      - name: Segregation of duties (author != approver != deployer)
        run: ./pipeline/scripts/sod-check.sh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Emit audit record (hash-chained)
        run: ./pipeline/scripts/emit-audit.sh G7-SOD PASS
